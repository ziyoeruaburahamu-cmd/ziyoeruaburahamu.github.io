<!DOCTYPE html>
<html lang="es">
<head>

<title>Catálogo · Mandiles y Bubuselas</title>

<style>

/* =====================================================
   PALETA
===================================================== */

:root {

    --bg: #f7f6f1;

    --paper: #ffffff;

    --paper-soft: #f1f3ed;

    --ink: #26332d;

    --muted: #69736d;

    --line: #dfe5de;

    --green-dark: #25443a;

    --green: #55796b;

    --green-soft: #dfe9e2;

    --sage: #8ca99b;

    --terracotta: #c9795d;

    --terracotta-soft: #f3dfd7;

    --gold: #c6a46a;

    --shadow:
        0 14px 40px
        rgba(37, 68, 58, .08);

    --shadow-hover:
        0 20px 45px
        rgba(37, 68, 58, .14);
}


/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    background:

        radial-gradient(
            circle at 10% 0%,
            rgba(140,169,155,.20),
            transparent 28%
        ),

        radial-gradient(
            circle at 100% 20%,
            rgba(201,121,93,.10),
            transparent 25%
        ),

        var(--bg);

    color: var(--ink);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =====================================================
   HERO
===================================================== */

.hero {

    min-height: 58vh;

    display: grid;

    place-items: center;

    text-align: center;

    padding:
        80px
        22px;

    position: relative;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 15% 20%,
            rgba(140,169,155,.18),
            transparent 28%
        ),

        linear-gradient(
            135deg,
            #203b32,
            #2d5144
        );

    color: white;
}


/* Decoración */

.hero::before {

    content: "";

    position: absolute;

    width: 420px;

    height: 420px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.08);

    top: -180px;

    right: -120px;
}

.hero::after {

    content: "";

    position: absolute;

    width: 280px;

    height: 280px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.06);

    bottom: -140px;

    left: -100px;
}

.hero-inner {

    max-width: 900px;

    position: relative;

    z-index: 2;
}

.kicker,
.eyebrow {

    display: inline-block;

    letter-spacing: .16em;

    text-transform: uppercase;

    font-size: .72rem;

    font-weight: 800;

    color: var(--terracotta);
}

.hero .kicker {

    color: #b9d0c5;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.10);

    padding:
        8px
        13px;

    border-radius: 999px;
}

h1 {

    font-family: Georgia, serif;

    font-weight: 400;

    font-size:
        clamp(
            3rem,
            8vw,
            6.5rem
        );

    line-height: .92;

    letter-spacing: -.04em;

    margin:
        22px
        0;
}

.hero p {

    max-width: 680px;

    margin: auto;

    color: #dce7e1;

    line-height: 1.8;

    font-size: 1rem;
}


/* =====================================================
   CONTENEDOR
===================================================== */

.container {

    max-width: 1200px;

    margin: auto;

    padding:
        65px
        22px
        90px;
}


/* =====================================================
   SECCIONES
===================================================== */

.local {

    background:
        rgba(255,255,255,.92);

    border:
        1px solid
        var(--line);

    border-radius: 28px;

    padding: 30px;

    margin-bottom: 38px;

    box-shadow:
        var(--shadow);

    overflow: hidden;

    transition:
        box-shadow .3s ease;
}

.local:hover {

    box-shadow:
        var(--shadow-hover);
}

.local-head {

    display: flex;

    justify-content: space-between;

    align-items: end;

    gap: 30px;

    margin-bottom: 26px;
}

h2 {

    font-family: Georgia, serif;

    font-size:
        clamp(
            1.9rem,
            3vw,
            2.7rem
        );

    font-weight: 400;

    color: var(--green-dark);

    letter-spacing: -.025em;

    margin:
        8px 0 0;
}


/* =====================================================
   PRECIOS
===================================================== */

.prices {

    min-width: 260px;

    background:
        var(--green-soft);

    border:
        1px solid
        #d2dfd7;

    border-radius: 18px;

    padding:
        10px
        17px;
}

.price-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    padding:
        9px
        0;

    border-bottom:
        1px solid
        #cfddd5;

    font-size: .9rem;

    color: var(--muted);
}

.price-row:last-child {

    border-bottom:
        none;
}

.price-row strong {

    color:
        var(--green-dark);

    font-size:
        .95rem;
}


/* =====================================================
   INFORMACIÓN DEL PROVEEDOR
===================================================== */

.provider-info {

    margin:
        5px
        0
        27px;

    padding:
        19px
        20px;

    background:
        #f7f9f6;

    border:
        1px solid
        var(--line);

    border-radius: 18px;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                220px,
                1fr
            )
        );

    gap: 14px;
}

.provider-item {

    display: flex;

    flex-direction: column;

    gap: 6px;
}

.provider-label {

    font-size: .68rem;

    text-transform: uppercase;

    letter-spacing: .12em;

    font-weight: 800;

    color:
        var(--green);
}

.provider-value {

    font-size: .94rem;

    line-height: 1.55;

    font-weight: 600;

    color: var(--ink);
}

.provider-value strong {

    color:
        var(--terracotta);
}


/* =====================================================
   CARRUSEL
===================================================== */

.carousel {

    position: relative;
}

.track {

    display: flex;

    gap: 18px;

    overflow-x: auto;

    scroll-snap-type:
        x mandatory;

    scroll-behavior: smooth;

    padding:
        4px
        4px
        20px;

    scrollbar-width: thin;

    scrollbar-color:
        var(--sage)
        transparent;
}

.track::-webkit-scrollbar {

    height: 7px;
}

.track::-webkit-scrollbar-track {

    background:
        transparent;
}

.track::-webkit-scrollbar-thumb {

    background:
        var(--sage);

    border-radius:
        20px;
}


/* =====================================================
   TARJETAS
===================================================== */

.card {

    flex:
        0 0
        clamp(
            250px,
            30vw,
            330px
        );

    scroll-snap-align:
        start;

    background:
        var(--paper);

    border:
        1px solid
        var(--line);

    border-radius:
        21px;

    overflow:
        hidden;

    box-shadow:
        0 7px 25px
        rgba(37,68,58,.06);

    transition:
        transform .28s ease,
        box-shadow .28s ease;
}

.card:hover {

    transform:
        translateY(-6px);

    box-shadow:
        0 18px 38px
        rgba(37,68,58,.13);
}


/* =====================================================
   IMAGEN
===================================================== */

.image-wrap {

    height: 330px;

    position: relative;

    overflow: hidden;

    background:

        linear-gradient(
            135deg,
            #eef2ed,
            #e3e9e4
        );

    display: grid;

    place-items: center;
}

.image-wrap img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

    transition:
        transform .4s ease;
}

.card:hover
.image-wrap img {

    transform:
        scale(1.045);
}


/* =====================================================
   CARGANDO
===================================================== */

.loading {

    position: absolute;

    inset: 0;

    display: grid;

    place-items: center;

    color:
        var(--muted);

    font-size: .85rem;

    pointer-events: none;
}


/* =====================================================
   IMAGEN FALLIDA
===================================================== */

.image-wrap.failed img {

    display: none;
}

.image-wrap.failed .loading {

    display: none;
}

.image-wrap.failed::after {

    content:
        "No se pudo cargar la imagen";

    color:
        var(--muted);

    font-size:
        .85rem;
}


/* =====================================================
   BOTÓN VER ORIGINAL
===================================================== */

.view {

    position: absolute;

    right: 12px;

    bottom: 12px;

    background:
        rgba(37,68,58,.92);

    color:
        white;

    text-decoration:
        none;

    padding:
        9px
        13px;

    border-radius:
        999px;

    font-size:
        .75rem;

    font-weight:
        700;

    backdrop-filter:
        blur(8px);

    z-index:
        5;

    transition:
        background .2s ease,
        transform .2s ease;
}

.view:hover {

    background:
        var(--terracotta);

    transform:
        translateY(-2px);
}


/* =====================================================
   CUERPO DE TARJETA
===================================================== */

.card-body {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    padding:
        16px
        17px;

    font-weight:
        700;

    color:
        var(--ink);
}

.card-body b {

    color:
        var(--terracotta);

    font-size:
        1.2rem;
}


/* =====================================================
   BOTONES CARRUSEL
===================================================== */

.nav {

    position:
        absolute;

    z-index:
        10;

    top:
        45%;

    transform:
        translateY(-50%);

    width:
        46px;

    height:
        46px;

    border:
        1px solid
        var(--line);

    border-radius:
        50%;

    background:
        rgba(255,255,255,.96);

    color:
        var(--green-dark);

    font-size:
        2rem;

    line-height:
        1;

    box-shadow:
        0 8px 22px
        rgba(37,68,58,.14);

    cursor:
        pointer;

    transition:
        transform .2s ease,
        background .2s ease,
        color .2s ease;
}

.prev {

    left:
        8px;
}

.next {

    right:
        8px;
}

.nav:hover {

    transform:
        translateY(-50%)
        scale(1.07);

    background:
        var(--green-dark);

    color:
        white;
}


/* =====================================================
   CONTACTO NIKTE
===================================================== */

.provider-contact {

    margin:
        27px
        0
        5px;

    padding:
        25px;

    background:

        linear-gradient(
            135deg,
            var(--green-dark),
            #315b4c
        );

    color:
        white;

    border-radius:
        22px;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        25px;

    flex-wrap:
        wrap;

    position:
        relative;

    overflow:
        hidden;
}


/* detalle */

.provider-contact::after {

    content: "";

    position:
        absolute;

    width:
        180px;

    height:
        180px;

    border-radius:
        50%;

    border:
        1px solid
        rgba(255,255,255,.08);

    right:
        -70px;

    bottom:
        -90px;
}

.provider-contact-content {

    flex:
        1;

    min-width:
        250px;

    position:
        relative;

    z-index:
        2;
}

.provider-contact .eyebrow {

    display:
        block;

    margin-bottom:
        7px;

    color:
        #b9d0c5;
}

.provider-contact h3 {

    font-family:
        Georgia,
        serif;

    font-size:
        1.6rem;

    font-weight:
        400;

    margin:
        0
        0
        12px;
}

.provider-contact p {

    margin:
        6px
        0;

    color:
        #dce7e1;

    line-height:
        1.65;

    font-size:
        .9rem;
}

.provider-phone {

    display:
        inline-block;

    margin-top:
        10px;

    padding:
        12px
        19px;

    border-radius:
        999px;

    background:
        var(--terracotta);

    color:
        white;

    text-decoration:
        none;

    font-weight:
        800;

    position:
        relative;

    z-index:
        2;

    transition:
        transform .2s ease,
        background .2s ease;
}

.provider-phone:hover {

    transform:
        translateY(-2px);

    background:
        #d8896d;
}


/* =====================================================
   MARY BABEROS
===================================================== */

.contact {

    text-align:
        center;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f5f8f4
        );
}

.contact h2 {

    margin-bottom:
        10px;
}

.contact p {

    color:
        var(--muted);

    line-height:
        1.7;

    max-width:
        650px;

    margin:
        12px
        auto
        20px;
}

.contact-btn {

    display:
        inline-block;

    background:
        var(--terracotta);

    color:
        white;

    text-decoration:
        none;

    padding:
        12px
        19px;

    border-radius:
        999px;

    font-weight:
        800;

    transition:
        transform .2s ease,
        background .2s ease;
}

.contact-btn:hover {

    transform:
        translateY(-2px);

    background:
        #d8896d;
}


/* =====================================================
   FOOTER
===================================================== */

footer {

    text-align:
        center;

    color:
        var(--muted);

    font-size:
        .85rem;

    padding:
        10px
        20px
        40px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 700px) {

    .hero {

        min-height:
            65vh;

        padding:
            60px
            20px;
    }

    h1 {

        font-size:
            clamp(
                3rem,
                15vw,
                5rem
            );
    }

    .container {

        padding:
            40px
            15px
            70px;
    }

    .local-head {

        display:
            block;
    }

    .prices {

        margin-top:
            18px;

        min-width:
            auto;
    }

    .local {

        padding:
            20px;

        border-radius:
            23px;
    }

    .image-wrap {

        height:
            290px;
    }

    .nav {

        display:
            none;
    }

    .card {

        flex-basis:
            82vw;
    }

    .provider-info {

        grid-template-columns:
            1fr;
    }

    .provider-contact {

        padding:
            21px;
    }
}

</style>
</head>

/* =====================================================
   IMÁGENES
===================================================== */

function imageSources(id) {

    return [

        `https://lh3.googleusercontent.com/d/${id}=w1200`,

        `https://drive.google.com/thumbnail?id=${id}&sz=w1200`,

        `https://drive.google.com/uc?export=view&id=${id}`

    ];

}


/* =====================================================
   CREAR TARJETA
===================================================== */

function createCard(item, sectionTitle) {

    const sources =
        imageSources(item.id);

    const original =
        `https://drive.google.com/file/d/${item.id}/view`;

    const article =
        document.createElement("article");

    article.className =
        "card";


    const imageWrap =
        document.createElement("div");

    imageWrap.className =
        "image-wrap";


    const loading =
        document.createElement("div");

    loading.className =
        "loading";

    loading.textContent =
        "Cargando imagen…";


    const img =
        document.createElement("img");

    img.alt =
        `${item.name} · ${sectionTitle}`;

    img.loading =
        "lazy";


    let sourceIndex =
        0;


    function loadNextImage() {

        if (
            sourceIndex >=
            sources.length
        ) {

            imageWrap.classList.add(
                "failed"
            );

            return;
        }


        img.src =
            sources[sourceIndex];

        sourceIndex++;
    }


    img.onerror =
        loadNextImage;


    img.onload = () => {

        loading.style.display =
            "none";

    };


    loadNextImage();


    const link =
        document.createElement("a");

    link.className =
        "view";

    link.href =
        original;

    link.target =
        "_blank";

    link.rel =
        "noopener noreferrer";

    link.textContent =
        "Ver original ↗";


    imageWrap.appendChild(
        img
    );

    imageWrap.appendChild(
        loading
    );

    imageWrap.appendChild(
        link
    );


    const body =
        document.createElement("div");

    body.className =
        "card-body";


    const name =
        document.createElement("span");

    name.textContent =
        item.name;


    const arrow =
        document.createElement("b");

    arrow.textContent =
        "→";


    body.appendChild(
        name
    );

    body.appendChild(
        arrow
    );


    article.appendChild(
        imageWrap
    );

    article.appendChild(
        body
    );


    return article;
}

   INFORMACIÓN DEL PROVEEDOR
===================================================== */

                Información

                ${info.description}
            </span>

        </div>

    `;


    return wrapper;
}

/* =====================================================
   CREAR SECCIÓN
===================================================== */

function createSection(group) {

    const section =
        document.createElement("section");

    section.className =
        "local";


    const header =
        document.createElement("div");

    header.className =
        "local-head";


    const titleContainer =
        document.createElement("div");


    const badge =
        document.createElement("span");

    badge.className =
        "eyebrow";

    badge.textContent =
        group.badge;


    const title =
        document.createElement("h2");

    title.textContent =
        group.title;


    titleContainer.appendChild(
        badge
    );

    titleContainer.appendChild(
        title
    );


    const prices =
        document.createElement("div");

    prices.className =
        "prices";


    group.prices.forEach(
        ([label, price]) => {

            const row =
                document.createElement("div");

            row.className =
                "price-row";


            const span =
                document.createElement("span");

            span.textContent =
                label;


            const strong =
                document.createElement("strong");

            strong.textContent =
                price;


            row.appendChild(
                span
            );

            row.appendChild(
                strong
            );

            prices.appendChild(
                row
            );

        }
    );


    header.appendChild(
        titleContainer
    );

    header.appendChild(
        prices
    );


    section.appendChild(
        header
    );


    if (
        group.providerInfo
    ) {

        section.appendChild(
            createProviderInfo(
                group.providerInfo
            )
        );

    }


    const carousel =
        document.createElement("div");

    carousel.className =
        "carousel";


    const previous =
        document.createElement("button");

    previous.className =
        "nav prev";

    previous.setAttribute(
        "aria-label",
        "Anterior"
    );

    previous.textContent =
        "‹";


    const track =
        document.createElement("div");

    track.className =
        "track";


    group.items.forEach(
        item => {

            track.appendChild(
                createCard(
                    item,
                    group.title
                )
            );

        }
    );


    const next =
        document.createElement("button");

    next.className =
        "nav next";

    next.setAttribute(
        "aria-label",
        "Siguiente"
    );

    next.textContent =
        "›";


    previous.onclick = () => {

        track.scrollBy({

            left:
                -track.clientWidth * .82,

            behavior:
                "smooth"

        });

    };


    next.onclick = () => {

        track.scrollBy({

            left:
                track.clientWidth * .82,

            behavior:
                "smooth"

        });

    };


    carousel.appendChild(
        previous
    );

    carousel.appendChild(
        track
    );

    carousel.appendChild(
        next
    );


    section.appendChild(
        carousel
    );


    if (
        group.providerInfo
    ) {

        section.appendChild(
            createProviderContact(
                group.providerInfo
            )
        );

    }


    return section;
}

/* =====================================================
   ARRASTRAR CARRUSELES
===================================================== */

document
    .querySelectorAll(".track")
    .forEach(track => {

        let pressed =
            false;

        let startX =
            0;

        let initialScroll =
            0;


        track.addEventListener(
            "mousedown",
            event => {

                pressed =
                    true;

                startX =
                    event.pageX -
                    track.offsetLeft;

                initialScroll =
                    track.scrollLeft;

            }
        );


        track.addEventListener(
            "mouseleave",
            () => {

                pressed =
                    false;

            }
        );


        track.addEventListener(
            "mouseup",
            () => {

                pressed =
                    false;

            }
        );


        track.addEventListener(
            "mousemove",
            event => {

                if (!pressed) {
                    return;
                }

                event.preventDefault();


                const currentX =
                    event.pageX -
                    track.offsetLeft;


                const distance =
                    (currentX - startX) * 1.5;


                track.scrollLeft =
                    initialScroll -
                    distance;

            }
        );

    });
