<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Fany ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Georgia,"Times New Roman",serif;

    background:
        radial-gradient(
            circle at 50% 38%,
            #4b203d 0%,
            #281326 38%,
            #120916 72%,
            #07040c 100%
        );

    color:white;
}

/* =========================
   CIELO
========================= */

.sky{
    position:fixed;
    inset:0;
    overflow:hidden;
}

/* Luna */

.moon{
    position:absolute;

    width:130px;
    height:130px;

    top:8%;
    right:10%;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff,
            #ffe8f2 55%,
            #e5b0c9
        );

    box-shadow:
        0 0 25px rgba(255,230,240,.6),
        0 0 70px rgba(255,150,195,.3),
        0 0 130px rgba(255,100,180,.15);

    animation:moon 6s ease-in-out infinite;
}

@keyframes moon{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }

}

/* Brillo central */

.glow{
    position:absolute;

    width:600px;
    height:600px;

    left:50%;
    top:48%;

    transform:translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(255,100,175,.14),
            rgba(255,60,150,.05) 40%,
            transparent 70%
        );

    animation:glow 5s ease-in-out infinite;
}

@keyframes glow{

    0%,100%{
        transform:translate(-50%,-50%) scale(.9);
    }

    50%{
        transform:translate(-50%,-50%) scale(1.12);
    }

}

/* =========================
   ESTRELLAS
========================= */

.star{
    position:absolute;

    color:#fff;

    opacity:.6;

    animation:
        twinkle 3s ease-in-out infinite;
}

@keyframes twinkle{

    0%,100%{
        opacity:.15;
        transform:scale(.6);
    }

    50%{
        opacity:1;
        transform:scale(1.3);
    }

}

/* =========================
   CONTENIDO
========================= */

.content{

    position:absolute;

    inset:0;

    z-index:20;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:30px;
}

/* Pequeño encabezado */

.pre{

    font-size:.85rem;

    letter-spacing:5px;

    text-transform:uppercase;

    color:#e5b1c7;

    margin-bottom:22px;

    opacity:0;

    animation:
        fadeUp 1.8s ease .5s forwards;
}

/* NOMBRE */

.name{

    font-size:
        clamp(5.5rem,27vw,12rem);

    font-weight:normal;

    line-height:.8;

    color:#fff4f9;

    text-shadow:

        0 0 8px rgba(255,255,255,.8),

        0 0 25px rgba(255,130,180,.7),

        0 0 60px rgba(255,70,150,.4),

        0 0 100px rgba(255,50,140,.2);

    opacity:0;

    animation:

        nameAppear 2.2s
        cubic-bezier(.2,.8,.2,1)
        1s forwards,

        floatName 5s
        ease-in-out
        3.5s infinite;
}

@keyframes nameAppear{

    from{

        opacity:0;

        transform:
            scale(.7)
            translateY(30px);

        filter:blur(15px);
    }

    to{

        opacity:1;

        transform:
            scale(1)
            translateY(0);

        filter:blur(0);
    }

}

@keyframes floatName{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

}

/* Línea */

.line{

    width:75px;

    height:1px;

    margin-top:30px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #e6a7c0,
            transparent
        );

    opacity:0;

    animation:
        fadeUp 1.5s ease 2.5s forwards;
}

/* MENSAJE */

.message{

    max-width:360px;

    margin-top:28px;

    font-size:
        clamp(1.05rem,4.5vw,1.35rem);

    line-height:1.8;

    color:#f0d6e1;

    font-style:italic;

    opacity:0;

    animation:
        fadeUp 2s ease 2.8s forwards;

}

/* Frase final */

.final{

    margin-top:25px;

    font-size:.95rem;

    letter-spacing:1px;

    color:#d99ab5;

    opacity:0;

    animation:
        fadeUp 2s ease 4s forwards;
}

/* Corazón */

.heart{

    margin-top:16px;

    font-size:28px;

    filter:
        drop-shadow(
            0 0 12px
            rgba(255,80,150,.9)
        );

    opacity:0;

    animation:

        fadeUp 1.5s ease 4.3s forwards,

        heartbeat 2s ease-in-out
        5.5s infinite;
}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.25);
    }

    30%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.15);
    }

}

/* =========================
   PÉTALOS
========================= */

.petal{

    position:absolute;

    top:-30px;

    width:12px;
    height:19px;

    background:#e89ab8;

    border-radius:
        80% 20% 80% 20%;

    opacity:.55;

    animation:
        fall linear infinite;
}

@keyframes fall{

    0%{

        transform:
            translateY(-30px)
            translateX(0)
            rotate(0);

        opacity:0;
    }

    10%{
        opacity:.7;
    }

    50%{

        transform:
            translateY(50vh)
            translateX(70px)
            rotate(180deg);
    }

    100%{

        transform:
            translateY(110vh)
            translateX(-60px)
            rotate(360deg);

        opacity:0;
    }

}

/* =========================
   FLORES
========================= */

.garden{

    position:absolute;

    bottom:-25px;

    left:0;

    width:100%;

    height:170px;

    z-index:15;

    background:
        radial-gradient(
            ellipse at center bottom,
            #1c0a19,
            #100716 65%,
            transparent 75%
        );
}

.flower{

    position:absolute;

    bottom:-15px;

    font-size:48px;

    filter:
        drop-shadow(
            0 0 8px
            rgba(255,100,170,.25)
        );

    animation:
        sway 4s ease-in-out infinite;
}

.flower:nth-child(1){
    left:1%;
    font-size:60px;
}

.flower:nth-child(2){
    left:14%;
    font-size:42px;
    animation-delay:1s;
}

.flower:nth-child(3){
    left:27%;
    font-size:55px;
    animation-delay:.5s;
}

.flower:nth-child(4){
    left:42%;
    font-size:45px;
    animation-delay:1.5s;
}

.flower:nth-child(5){
    left:58%;
    font-size:60px;
    animation-delay:.8s;
}

.flower:nth-child(6){
    left:73%;
    font-size:43px;
    animation-delay:1.3s;
}

.flower:nth-child(7){
    left:87%;
    font-size:60px;
    animation-delay:.4s;
}

@keyframes sway{

    0%,100%{
        transform:rotate(-4deg) translateY(0);
    }

    50%{
        transform:rotate(5deg) translateY(-7px);
    }

}

/* =========================
   CORAZONES AL TOCAR
========================= */

.floating-heart{

    position:fixed;

    pointer-events:none;

    z-index:100;

    color:#ff9cbd;

    font-size:20px;

    text-shadow:
        0 0 12px rgba(255,80,150,.8);

    animation:
        heartFloat 2s ease-out forwards;
}

@keyframes heartFloat{

    0%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.5);
    }

    100%{

        opacity:0;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% - 180px)
            )
            scale(1.3)
            rotate(20deg);
    }

}

/* =========================
   ANIMACIÓN GENERAL
========================= */

@keyframes fadeUp{

    from{

        opacity:0;

        transform:
            translateY(20px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }

}

/* =========================
   MÓVIL
========================= */

@media(max-width:600px){

    .moon{

        width:100px;
        height:100px;

        top:8%;
        right:7%;
    }

    .pre{

        font-size:.7rem;

        letter-spacing:3px;

        max-width:300px;
    }

    .name{

        font-size:
            clamp(5rem,28vw,8rem);
    }

    .message{

        max-width:310px;

        font-size:1.02rem;

        line-height:1.75;
    }

    .final{

        font-size:.85rem;
    }

}

</style>
</head>

<body>

<div class="sky">

    <div class="moon"></div>

    <div class="glow"></div>

    <!-- estrellas -->

    <div class="star" style="top:13%;left:10%;font-size:10px">✦</div>
    <div class="star" style="top:20%;left:30%;font-size:7px">✧</div>
    <div class="star" style="top:31%;left:8%;font-size:12px">✦</div>
    <div class="star" style="top:40%;right:16%;font-size:8px">✧</div>
    <div class="star" style="top:51%;left:17%;font-size:9px">✦</div>
    <div class="star" style="top:61%;right:8%;font-size:12px">✦</div>
    <div class="star" style="top:72%;left:8%;font-size:7px">✧</div>
    <div class="star" style="top:78%;right:24%;font-size:10px">✦</div>

    <!-- pétalos -->

    <div class="petal"
         style="left:8%;animation-duration:9s;animation-delay:1s"></div>

    <div class="petal"
         style="left:22%;animation-duration:11s;animation-delay:3s"></div>

    <div class="petal"
         style="left:38%;animation-duration:8s"></div>

    <div class="petal"
         style="left:55%;animation-duration:10s;animation-delay:4s"></div>

    <div class="petal"
         style="left:70%;animation-duration:9s;animation-delay:2s"></div>

    <div class="petal"
         style="left:86%;animation-duration:12s;animation-delay:5s"></div>

</div>


<!-- CONTENIDO -->

<div class="content">

    <div class="pre">
        Para la mujer que hizo especial mi mundo
    </div>

    <div class="name">
        Fany
    </div>

    <div class="line"></div>

    <div class="message">

        De todas las casualidades
        que pudo regalarme la vida,
        conocerte fue mi favorita.

        <br><br>

        Y desde que llegaste,
        mis días tienen una sonrisa
        que antes no tenían.

    </div>

    <div class="final">
        Qué bonito es coincidir contigo.
    </div>

    <div class="heart">
        ❤️
    </div>

</div>


<!-- JARDÍN -->

<div class="garden">

    <div class="flower">🌹</div>
    <div class="flower">🌷</div>
    <div class="flower">🌸</div>
    <div class="flower">🌺</div>
    <div class="flower">🌹</div>
    <div class="flower">🌷</div>
    <div class="flower">🌸</div>

</div>


<script>

/* Más estrellas aleatorias */

for(let i=0;i<35;i++){

    const star =
        document.createElement("div");

    star.className="star";

    star.textContent =
        Math.random() > .5
        ? "✦"
        : "·";

    star.style.left =
        Math.random()*100+"%";

    star.style.top =
        Math.random()*100+"%";

    star.style.fontSize =
        (Math.random()*7+4)+"px";

    star.style.animationDelay =
        Math.random()*4+"s";

    document
        .querySelector(".sky")
        .appendChild(star);
}


/* Corazones al tocar */

document.addEventListener(
    "click",
    function(e){

        for(let i=0;i<6;i++){

            const heart =
                document.createElement("div");

            heart.className =
                "floating-heart";

            heart.textContent =
                Math.random()>.25
                ? "❤"
                : "♡";

            heart.style.left =
                e.clientX+"px";

            heart.style.top =
                e.clientY+"px";

            heart.style.setProperty(
                "--x",
                ((Math.random()-.5)*150)+"px"
            );

            heart.style.animationDelay =
                (i*.1)+"s";

            document.body
                .appendChild(heart);

            setTimeout(
                ()=>{
                    heart.remove();
                },
                2200
            );
        }

    }
);

</script>

</body>
</html>
